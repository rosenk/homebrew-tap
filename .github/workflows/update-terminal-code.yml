name: Update terminal-code

on:
  schedule:
    - cron: "23 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
      - name: Update formula
        run: ruby scripts/update-terminal-code.rb
      - name: Commit update
        run: |
          if git diff --quiet; then
            exit 0
          fi
          version=$(ruby -e 'puts File.read("Formula/terminal-code.rb")[/^  version "([^"]+)"$/, 1]')
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/terminal-code.rb
          git commit -m "terminal-code ${version}"
          git push
